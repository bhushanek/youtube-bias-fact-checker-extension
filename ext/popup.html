<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 15px; font-family: 'Segoe UI', sans-serif; background: #f9f9f9; }
    h2 { margin: 0 0 15px 0; font-size: 16px; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
    
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
    input:focus { border-color: #065fd4; outline: none; }
    
    .note { font-size: 11px; color: #888; margin-top: 2px; }

    button { 
      width: 100%; padding: 10px; background: #065fd4; color: #fff; 
      border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; 
    }
    button:hover { background: #0556bf; }
    
    #status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 15px; }
    .success { color: green; }
  </style>
</head>
<body>
  <h2>⚙️ AI Settings</h2>

  <div class="input-group">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API Key here">
    <div class="note"><a href="https://aistudio.google.com/app/apikey" target="_blank">Get a free key here</a></div>
  </div>

  <div class="input-group">
    <label>Model Name (Optional)</label>
    <input type="text" id="modelName" placeholder="gemini-2.5-flash" value="gemini-2.5-flash">
  </div>

 <div class="input-group">
  <label>Output Language</label>
  <select id="languageSelect">
    <option value="English">English 🇬🇧</option>
    <option value="Hindi">Hindi 🇮🇳</option>
    <option value="Spanish">Spanish 🇪🇸</option>
    <option value="French">French 🇫🇷</option>
    <option value="German">German 🇩🇪</option>
    <option value="Japanese">Japanese 🇯🇵</option>
    <option value="Chinese">Chinese 🇨🇳</option>
    <option value="Russian">Russian 🇷🇺</option>
    <option value="Arabic">Arabic 🇸🇦</option>
    <option value="Portuguese">Portuguese 🇵🇹</option>
  </select>
</div>


  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
